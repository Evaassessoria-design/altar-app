<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <title>ALTAR — Gestão para Decoradores de Eventos</title>
    <meta
      name="description"
      content="Plataforma de gestão para decoradores de eventos. Organize briefing, equipe, fornecedores, financeiro, montagem e inteligência artificial em um só lugar."
    />
    <meta name="author" content="ALTAR" />
    <meta name="application-name" content="ALTAR" />
    <!-- O favicon era um EMOJI ⚡ embutido como data-URI: placeholder do
         gerador do projeto, que atravessou até aqui. Agora é a arte oficial,
         recortada no símbolo (ver scripts/brand/gerar-icones.py). -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16.png" />

    <meta property="og:title" content="ALTAR — Gestão para Decoradores de Eventos" />
    <meta
      property="og:description"
      content="Plataforma de gestão para decoradores de eventos. Organize briefing, equipe, fornecedores, financeiro, montagem e inteligência artificial em um só lugar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.appaltar.com.br" />
    <meta property="og:site_name" content="ALTAR" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Sem `og:image` o link colado no WhatsApp virava um retângulo cinza com
         o domínio. A imagem é a arte oficial sobre o bege dela mesma. -->
    <meta property="og:image" content="https://www.appaltar.com.br/brand/altar-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ALTAR — o símbolo do arco com a flor" />

    <!-- `summary` mostra um selo pequeno; `summary_large_image` usa a arte
         inteira, que é o motivo de ela existir em 1200×630. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ALTAR — Gestão para Decoradores de Eventos" />
    <meta
      name="twitter:description"
      content="Plataforma de gestão para decoradores de eventos. Organize briefing, equipe, fornecedores, financeiro, montagem e inteligência artificial em um só lugar."
    />
    <meta name="twitter:image" content="https://www.appaltar.com.br/brand/altar-og.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <!-- PWA Configuration -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#b89a6a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Altar" />
    <!-- 180×180 é o tamanho que o iOS pede. Antes isto apontava para um
         arquivo de 860×1600 — um PRINT de tela inicial de iPhone, com o ícone
         pequeno no meio e a palavra "Altar" embaixo. Era essa a causa do
         símbolo minúsculo no aparelho: o sistema espremia um retrato em um
         quadrado e ainda cortava as bordas. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
